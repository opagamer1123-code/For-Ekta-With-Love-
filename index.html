    <script>
      // Gracefully silence sandbox iframe WebSocket connection errors
      window.addEventListener('error', function (e) {
        if (e && (e.message && e.message.includes('WebSocket') || (e.target && e.target instanceof WebSocket))) {
          if (e.preventDefault) e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && e.reason.message && e.reason.message.includes('WebSocket')) {
          if (e.preventDefault) e.preventDefault();
        }
      });
    </script>
